name: SonarQube Scan for PNP-CCV

on:
  push:
    branches:                                                                                                      
      - main
      - teste
      
jobs:
  sonar:
    name: Run SonarScanner on Self-Hosted Runner
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Download SonarScanner CLI
        run: |
          if [ ! -f sonar-scanner/bin/sonar-scanner ]; then
             curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
             unzip sonar-scanner.zip
             mv sonar-scanner-*/ sonar-scanner
          fi
      - name: Run SonarScanner local
        env:
          # Crie esse secret no nivel de organizaçao 
          SONARQ_USER_TOKEN: ${{ secrets.SONARQ_USER_TOKEN }}
          # Crie o nome do host no nivel de organizaçao
          # e lembre que ele deve conter o home na visao da maquina do runner          
          SONARQ_HOST_URL: ${{ vars.SONARQ_SERVER_URL }}
        run: |
          # Crie o nome do projeto (e principalmnte seu nome chave) 
          # no Sonarqube igual ao nome do repositorio seguido do 
          # do nome do branch e do usuario github do desenvolvedor 
          SONARQ_PROJECT_KEY=${{ github.repository }}-${{ github.ref_name }}-${{ github.actor }}
          SONARQ_PROJECT_KEY=$(basename $SONARQ_PROJECT_KEY)
          sonar-scanner/bin/sonar-scanner \
            -Dsonar.projectKey=$SONARQ_PROJECT_KEY \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONARQ_HOST_URL \
            -Dsonar.login=$SONARQ_USER_TOKEN
 
