name: SonarQube Scan for PNP-CCV

on:
  push:
    branches:  [main, teste]
  pull_request:
    types: [opened, synchronize, reopened]  
    branches:  [main, teste]
    
jobs:
  sonar:
    name: Run SonarScanner on Self-Hosted Runner
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Download SonarScanner CLI
        run: |
          DIR=$(pwd)
          cd /home/runner
          if [ ! -d sonar-scanner ]; then
             curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
             unzip sonar-scanner.zip
             mv sonar-scanner-*/ sonar-scanner
          fi
          cd $DIR
      - name: Run SonarScanner local
        env:
          # Crie esse secret no nivel de organizaçao 
          SONARQ_USER_TOKEN: ${{ secrets.SONARQ_USER_TOKEN }}
          # Crie o nome do host no nivel de organizaçao
          # e lembre que ele deve conter o home na visao da maquina do runner          
          SONARQ_HOST_URL: ${{ vars.SONARQ_SERVER_URL }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
             GITHUB_BRANCH=${{ github.head_ref }}
             GITHUB_EVENT="PR"
             GITHUB_ID=${{ github.event.pull_request.number }}
             GITHUB_AUTHOR=${{ github.actor }}
          else
             GITHUB_BRANCH=${{ github.ref_name }}
             GITHUB_EVENT="PUSH"
             GITHUB_ID=${{ github.actor }}
             GITHUB_AUTHOR=${{ github.actor }}
          fi
          SONARQ_PROJECT_KEY=${{ github.repository }}-$GITHUB_BRANCH-$GITHUB_EVENT-$GITHUB_ID
          SONARQ_PROJECT_KEY=$(basename $SONARQ_PROJECT_KEY)

          curl -u $SONARQ_USER_TOKEN:  $SONARQ_HOST_URL/api/projects/create \
             -d name=$SONARQ_PROJECT_KEY -d project=$SONARQ_PROJECT_KEY

          curl -u $SONARQ_USER_TOKEN:  $SONARQ_HOST_URL/api/projects/update_visibility \
             -d project=$SONARQ_PROJECT_KEY -d visibility=private 
             
          echo curl -u $SONARQ_USER_TOKEN: $SONARQ_HOST_URL/api/permissions/add_user \
             -d login=$GITHUB_AUTHOR -d permission=user -d projectKey=$SONARQ_PROJECT_KEY

          /home/runner/sonar-scanner/bin/sonar-scanner \
             -Dsonar.projectKey=$SONARQ_PROJECT_KEY \
             -Dsonar.sources=. \
             -Dsonar.host.url=$SONARQ_HOST_URL \
             -Dsonar.token=$SONARQ_USER_TOKEN
 
